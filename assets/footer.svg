<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .pulse { animation: pulse 4s ease-in-out infinite; }
    </style>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D2D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2D2D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF2D2D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="60" fill="transparent"/>
  <line x1="150" y1="10" x2="750" y2="10" stroke="url(#lineGrad)" stroke-width="1"/>
  <text x="450" y="38" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#484F58" class="pulse">&lt;/&gt; with precision</text>
  <circle cx="150" cy="10" r="1.5" fill="#FF2D2D" opacity="0.5"/>
  <circle cx="750" cy="10" r="1.5" fill="#FF2D2D" opacity="0.5"/>
</svg>