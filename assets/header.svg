<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 6px #FF2D2D); }
        50% { opacity: 1; filter: drop-shadow(0 0 14px #FF2D2D); }
      }
      @keyframes scanline {
        0% { transform: translateY(-200px); }
        100% { transform: translateY(200px); }
      }
      @keyframes flicker {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.8; }
        97% { opacity: 1; }
        98% { opacity: 0.6; }
      }
      .hex { animation: pulse 4s ease-in-out infinite; }
      .hex-delay { animation: pulse 4s ease-in-out infinite; animation-delay: 1.5s; }
      .neon-text { animation: glow 3s ease-in-out infinite; }
      .scan { animation: scanline 6s linear infinite; opacity: 0.04; }
      .title-flicker { animation: flicker 8s linear infinite; }
    </style>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D2D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2D2D" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF2D2D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="darkFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <filter id="neonFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#FF2D2D" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#FF2D2D" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="200" fill="url(#darkFade)"/>
  <rect class="scan" x="0" y="0" width="900" height="4" fill="#FF2D2D"/>
  <g class="hex" opacity="0.4">
    <polygon points="60,60 85,45 110,60 110,90 85,105 60,90" fill="none" stroke="#FF2D2D" stroke-width="1.5" opacity="0.5"/>
    <polygon points="20,95 45,80 70,95 70,125 45,140 20,125" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.3"/>
    <polygon points="90,110 115,95 140,110 140,140 115,155 90,140" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.35"/>
  </g>
  <g class="hex-delay" opacity="0.4">
    <polygon points="30,30 55,15 80,30 80,60 55,75 30,60" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.25"/>
    <polygon points="100,45 125,30 150,45 150,75 125,90 100,75" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.2"/>
  </g>
  <g class="hex-delay" opacity="0.4">
    <polygon points="790,60 815,45 840,60 840,90 815,105 790,90" fill="none" stroke="#FF2D2D" stroke-width="1.5" opacity="0.5"/>
    <polygon points="830,95 855,80 880,95 880,125 855,140 830,125" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.3"/>
    <polygon points="760,110 785,95 810,110 810,140 785,155 760,140" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.35"/>
  </g>
  <g class="hex" opacity="0.4">
    <polygon points="820,30 845,15 870,30 870,60 845,75 820,60" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.25"/>
    <polygon points="750,45 775,30 800,45 800,75 775,90 750,75" fill="none" stroke="#FF2D2D" stroke-width="1" opacity="0.2"/>
  </g>
  <line x1="200" y1="65" x2="340" y2="65" stroke="#FF2D2D" stroke-width="1" opacity="0.6"/>
  <line x1="560" y1="65" x2="700" y2="65" stroke="#FF2D2D" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="135" x2="340" y2="135" stroke="#FF2D2D" stroke-width="1" opacity="0.6"/>
  <line x1="560" y1="135" x2="700" y2="135" stroke="#FF2D2D" stroke-width="1" opacity="0.6"/>
  <path d="M200,65 L200,55 L210,55" fill="none" stroke="#FF2D2D" stroke-width="2" opacity="0.8"/>
  <path d="M700,65 L700,55 L690,55" fill="none" stroke="#FF2D2D" stroke-width="2" opacity="0.8"/>
  <path d="M200,135 L200,145 L210,145" fill="none" stroke="#FF2D2D" stroke-width="2" opacity="0.8"/>
  <path d="M700,135 L700,145 L690,145" fill="none" stroke="#FF2D2D" stroke-width="2" opacity="0.8"/>
  <text class="neon-text" x="450" y="98" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="bold" fill="#E6EDF3" filter="url(#neonFilter)">MEMISDEV</text>
  <text class="title-flicker" x="450" y="125" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FF6B6B" letter-spacing="6">PRODUCT ENGINEER</text>
  <rect x="350" y="145" width="200" height="1" fill="url(#redGlow)" class="neon-text"/>
  <circle cx="345" cy="145" r="2" fill="#FF2D2D" opacity="0.8" class="hex"/>
  <circle cx="555" cy="145" r="2" fill="#FF2D2D" opacity="0.8" class="hex"/>
  <rect x="0" y="0" width="900" height="1" fill="url(#redGlow)" opacity="0.5"/>
  <rect x="0" y="199" width="900" height="1" fill="url(#redGlow)" opacity="0.5"/>
</svg>